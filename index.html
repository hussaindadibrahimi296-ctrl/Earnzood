<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0f1117">

    <title>EarnZood</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <!-- EarnZood CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header>

        <div class="logo">🪙</div>

        <h1>EarnZood</h1>

        <p>Earn • Complete • Reward</p>

    </header>


    <!-- Balance -->
    <section class="balance">

        <span>موجودی شما</span>

        <strong id="balance">
            0 🪙
        </strong>

    </section>


    <!-- Main Buttons -->
    <main class="buttons">

        <!-- Rewarded Ad -->
        <button id="adsButton" class="menu-button">

            <span class="button-icon">🎬</span>

            <span class="button-text">

                <b>مشاهده تبلیغ</b>

                <small id="adsStatus">
                    با مشاهده تبلیغ 100 سکه بگیر
                </small>

            </span>

            <span class="arrow">‹</span>

        </button>


        <!-- AdsGram Tasks -->
        <button id="tasksButton" class="menu-button">

            <span class="button-icon">📋</span>

            <span class="button-text">

                <b>تسک‌ها</b>

                <small id="tasksStatus">
                    تسک انجام بده و 100 سکه بگیر
                </small>

            </span>

            <span class="arrow">‹</span>

        </button>


        <!-- Referral -->
        <button id="referralButton" class="menu-button">

            <span class="button-icon">👥</span>

            <span class="button-text">

                <b>دعوت دوستان</b>

                <small>
                    با دعوت دوستان پاداش بگیر
                </small>

            </span>

            <span class="arrow">‹</span>

        </button>


        <!-- Withdraw -->
        <button id="withdrawButton" class="menu-button">

            <span class="button-icon">💰</span>

            <span class="button-text">

                <b>برداشت موجودی</b>

                <small>
                    حداقل برداشت 5,000,000 سکه
                </small>

            </span>

            <span class="arrow">‹</span>

        </button>


        <!-- Profile -->
        <button id="profileButton" class="menu-button">

            <span class="button-icon">👤</span>

            <span class="button-text">

                <b>حساب کاربری</b>

                <small>
                    اطلاعات حساب و تراکنش‌ها
                </small>

            </span>

            <span class="arrow">‹</span>

        </button>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            EarnZood © 2026
        </p>

    </footer>

</div>


<!-- EarnZood JavaScript -->
<script src="app.js?v=4"></script>

</body>

</html>
